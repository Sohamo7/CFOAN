<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body style="width: 300px; padding: 15px; font-family: sans-serif;">
  <h3 style="margin-top: 0; margin-bottom: 10px;">AI Assistant</h3>
  
  <div style="display: flex; gap: 5px; margin-bottom: 15px;">
    <input type="text" id="userName" placeholder="Your Name (for sign-off)" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: sans-serif;">
    <button id="saveNameBtn" style="padding: 8px 12px; background: #5f6368; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save</button>
  </div>

  <p style="font-size: 12px; color: #555; margin-bottom: 5px;">Actions:</p>
  
  <button id="processEmail" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #0b57d0; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
    📅 Schedule Meeting
  </button>

  <button id="summarizeEmail" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #e37400; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
    📝 Summarize Email
  </button>

  <button id="draftReply" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #188038; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
    ✍️ Draft Reply
  </button>
  
  <p id="status" style="font-size: 12px; color: gray; text-align: center; margin-bottom: 10px; min-height: 15px;"></p>
  
  <textarea id="replyBox" style="display: none; width: 100%; height: 120px; margin-bottom: 10px; padding: 5px; font-family: sans-serif; box-sizing: border-box;"></textarea>
  <button id="copyBtn" style="display: none; width: 100%; padding: 8px; background: #5f6368; color: white; border: none; border-radius: 4px; cursor: pointer;">
    📋 Copy to Clipboard
  </button>

  <script src="popup.js"></script>
</body>
</html>
