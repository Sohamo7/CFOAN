<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* 1. Core Variables */
    :root {
      --primary: #6366f1;         
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35); /* For the hover glow */
      --bg-base: #ffffff;
      --bg-surface: rgba(255, 255, 255, 0.7); /* Slightly transparent for the gradient to peek through */
      --text-main: #0f172a;       
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --focus-ring: rgba(99, 102, 241, 0.25);
    }

    /* 2. Animated Gradient Background */
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      border-top: 4px solid var(--primary);
      
      /* The soft animated mesh gradient */
      background: linear-gradient(-45deg, #f8fafc, #e0e7ff, #f3e8ff, #ffffff);
      background-size: 300% 300%;
      animation: gradientShift 10s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      padding: 20px;
    }

    /* 3. Smooth Fade & Slide In Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Staggering the animations so they load in a cascade */
    .header {
      animation: fadeUp 0.5s ease-out forwards;
      margin-bottom: 20px;
    }

    .input-group {
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.1s forwards;
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .action-grid {
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.2s forwards;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h3 {
      font-weight: 700;
      font-size: 18px;
      margin: 0 0 4px 0;
      color: var(--text-main);
    }

    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.4;
    }

    /* 4. Inputs */
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      color: var(--text-main);
      background-color: var(--bg-base);
      box-shadow: var(--shadow-sm);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    /* 5. Buttons & Hover Glows */
    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* Smoother hover transition */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #saveNameBtn {
      padding: 0 16px;
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(4px); /* Glassmorphism effect */
    }

    #saveNameBtn:hover {
      background-color: var(--bg-base);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      justify-content: flex-start;
      padding-left: 16px;
      backdrop-filter: blur(4px); /* Glassmorphism effect */
    }

    /* THE GLOW EFFECT */
    .action-btn:hover {
      border-color: var(--primary);
      background-color: var(--bg-base);
      box-shadow: 0 4px 15px var(--primary-glow); /* Outer glowing shadow */
      transform: translateY(-2px); /* Lift up */
      color: var(--primary);
    }

    /* 6. Status & Output Box */
    #status {
      font-size: 12px;
      color: var(--primary); /* Made it primary color so status messages pop */
      text-align: center;
      min-height: 16px;
      margin: 16px 0 12px 0;
      font-weight: 600;
      animation: fadeUp 0.3s ease-out forwards;
    }

    textarea {
      height: 120px;
      resize: none;
      margin-bottom: 12px;
      animation: fadeUp 0.4s ease-out forwards;
    }

    #copyBtn {
      width: 100%;
      padding: 10px;
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
      animation: fadeUp 0.5s ease-out forwards;
    }

    #copyBtn:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 18px var(--primary-glow);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h3>AI Assistant</h3>
      <p class="subtitle">Your automated workflow companion.</p>
    </div>
    
    <div class="input-group">
      <input type="text" id="userName" placeholder="Sign-off name...">
      <button id="saveNameBtn">Save</button>
    </div>

    <div class="action-grid">
      <button class="action-btn" id="processEmail">
        📅 Schedule Meeting
      </button>
      <button class="action-btn" id="summarizeEmail">
        📝 Summarize Email
      </button>
      <button class="action-btn" id="draftReply">
        ✍️ Draft Reply
      </button>
    </div>
    
    <p id="status"></p>
    
    <textarea id="replyBox" style="display: none;"></textarea>
    <button id="copyBtn" style="display: none;">📋 Copy to Clipboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
